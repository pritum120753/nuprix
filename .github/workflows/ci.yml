name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nuprix-backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:9000
      JWT_SECRET: ci-only-secret
      COOKIE_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nuprix-backend/package-lock.json
      - run: npm ci
      - name: Lint backend
        working-directory: nuprix-backend/apps/backend
        run: npm run lint
      - name: Unit tests
        working-directory: nuprix-backend/apps/backend
        run: npm run test:unit
      - name: Integration tests
        working-directory: nuprix-backend/apps/backend
        run: npm run test:integration:http

  storefront:
    # The Medusa starter storefront already has lint errors that predate this
    # workflow. Report them without blocking merges; remove continue-on-error
    # once they are fixed.
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nuprix-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nuprix-backend/package-lock.json
      - run: npm ci
      - name: Lint storefront
        working-directory: nuprix-backend/apps/storefront
        run: npm run lint
